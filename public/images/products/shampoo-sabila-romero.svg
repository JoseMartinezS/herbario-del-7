<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEE7"/>
      <stop offset="1" stop-color="#D0DBD3"/>
    </linearGradient>
  </defs>

  <!-- Fondo verde salvia -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.35"/>

  <!-- Hojas de sábila (izquierda) -->
  <g transform="translate(262,352)">
    <path d="M0,0 C24,-44 24,-112 0,-150 C-24,-112 -24,-44 0,0 Z" transform="rotate(-24)" fill="#6E8F7B"/>
    <path d="M0,0 C24,-44 24,-112 0,-150 C-24,-112 -24,-44 0,0 Z" transform="rotate(20) translate(10,0)" fill="#5C7668"/>
  </g>

  <!-- Sprig de romero (derecha) -->
  <g transform="translate(540,470)" stroke="#7C9885" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M0,0 C4,-40 4,-90 0,-128"/>
    <path d="M-2,-16 L-18,-24 M2,-16 L18,-24"/>
    <path d="M-3,-36 L-19,-42 M3,-36 L19,-42"/>
    <path d="M-4,-56 L-19,-61 M4,-56 L19,-61"/>
    <path d="M-4,-76 L-18,-80 M4,-76 L18,-80"/>
    <path d="M-4,-94 L-16,-97 M4,-94 L16,-97"/>
    <path d="M-3,-110 L-14,-113 M3,-110 L14,-113"/>
  </g>

  <!-- Bomba dispensadora -->
  <path d="M378,352 L378,258 L438,258 C446,258 450,263 450,270 L450,292 C450,299 445,304 438,304 L416,304 L416,352 Z" fill="#5C7668" stroke="#5C7668" stroke-width="6" stroke-linejoin="round"/>

  <!-- Cuerpo del shampoo -->
  <rect x="310" y="352" width="180" height="278" rx="20" fill="#FDFBF5" opacity="0.94"/>
  <rect x="310" y="352" width="180" height="278" rx="20" fill="none" stroke="#5C7668" stroke-width="10"/>

  <!-- Etiqueta con abanico de hojas -->
  <rect x="332" y="452" width="136" height="104" rx="14" fill="#EFF4EF"/>
  <rect x="332" y="452" width="136" height="104" rx="14" fill="none" stroke="#5C7668" stroke-width="6"/>
  <path d="M0,0 C22,-38 22,-96 0,-132 C-22,-96 -22,-38 0,0 Z" transform="translate(368,536) rotate(-32) scale(0.62)" fill="#6E8F7B"/>
  <path d="M0,0 C22,-38 22,-96 0,-132 C-22,-96 -22,-38 0,0 Z" transform="translate(432,536) rotate(32) scale(0.62)" fill="#6E8F7B"/>
  <path d="M0,0 C22,-38 22,-96 0,-132 C-22,-96 -22,-38 0,0 Z" transform="translate(400,538) scale(0.7)" fill="#5C7668"/>

  <!-- Sombra en el piso -->
  <ellipse cx="400" cy="646" rx="130" ry="16" fill="#41584C" opacity="0.18"/>
</svg>
