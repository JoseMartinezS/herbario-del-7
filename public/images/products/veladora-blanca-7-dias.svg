<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E8DA"/>
      <stop offset="1" stop-color="#EACBA8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4763B"/>
      <stop offset="1" stop-color="#E9C87E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9A441" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo cálido de terracota -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.4"/>

  <!-- Halo de la llama -->
  <circle cx="400" cy="292" r="96" fill="url(#glow)"/>

  <!-- Llama -->
  <path d="M400,232 C416,258 424,278 424,296 C424,320 413,334 400,334 C387,334 376,320 376,296 C376,278 384,258 400,232 Z" fill="url(#flame)"/>
  <path d="M400,282 C407,293 410,301 410,309 C410,322 405,330 400,330 C395,330 390,322 390,309 C390,301 393,293 400,282 Z" fill="#F6DFA6"/>

  <!-- Pabilo -->
  <rect x="396" y="334" width="8" height="100" rx="4" fill="#6F3F20"/>

  <!-- Vaso de la veladora -->
  <rect x="288" y="386" width="224" height="270" rx="20" fill="#FFFFFF" opacity="0.92"/>
  <rect x="288" y="386" width="224" height="270" rx="20" fill="none" stroke="#C9A97E" stroke-width="10"/>

  <!-- Cera blanca -->
  <rect x="312" y="446" width="176" height="192" rx="12" fill="#FBF7EC"/>
  <ellipse cx="400" cy="446" rx="88" ry="16" fill="#FFFDF6"/>

  <!-- Sombra en el piso -->
  <ellipse cx="400" cy="664" rx="150" ry="17" fill="#B3743F" opacity="0.18"/>

  <!-- Destellos -->
  <path d="M300,226 L308,243 L326,250 L308,257 L300,274 L292,257 L274,250 L292,243 Z" fill="#D9A441" opacity="0.65"/>
  <path d="M502,236 L508,249 L521,255 L508,261 L502,274 L496,261 L483,255 L496,249 Z" fill="#D9A441" opacity="0.5"/>
</svg>
