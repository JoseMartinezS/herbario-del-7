<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DFCB"/>
      <stop offset="1" stop-color="#E7C29B"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4763B"/>
      <stop offset="1" stop-color="#E9C87E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9A441" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo cálido de terracota -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.4"/>

  <!-- Halo de la llama -->
  <circle cx="400" cy="292" r="96" fill="url(#glow)"/>

  <!-- Llama -->
  <path d="M400,232 C416,258 424,278 424,296 C424,320 413,334 400,334 C387,334 376,320 376,296 C376,278 384,258 400,232 Z" fill="url(#flame)"/>
  <path d="M400,282 C407,293 410,301 410,309 C410,322 405,330 400,330 C395,330 390,322 390,309 C390,301 393,293 400,282 Z" fill="#F6DFA6"/>

  <!-- Pabilo -->
  <rect x="396" y="334" width="8" height="100" rx="4" fill="#6F3F20"/>

  <!-- Vaso de la veladora -->
  <rect x="288" y="386" width="224" height="270" rx="20" fill="#FFFFFF" opacity="0.92"/>
  <rect x="288" y="386" width="224" height="270" rx="20" fill="none" stroke="#C9A97E" stroke-width="10"/>

  <!-- Cera roja -->
  <rect x="312" y="446" width="176" height="192" rx="12" fill="#B3402F"/>
  <ellipse cx="400" cy="446" rx="88" ry="16" fill="#C24B38"/>
  <rect x="336" y="480" width="24" height="142" rx="12" fill="#FFFFFF" opacity="0.22"/>

  <!-- Sombra en el piso -->
  <ellipse cx="400" cy="664" rx="150" ry="17" fill="#8A4E26" opacity="0.2"/>

  <!-- Destellos -->
  <path d="M296,232 L304,248 L321,255 L304,262 L296,278 L288,262 L271,255 L288,248 Z" fill="#D9A441" opacity="0.65"/>
  <path d="M506,244 L511,255 L522,261 L511,266 L506,277 L501,266 L490,261 L501,255 Z" fill="#D9A441" opacity="0.5"/>
</svg>
