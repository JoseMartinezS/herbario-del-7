<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DEF0EA"/>
      <stop offset="1" stop-color="#BEE0D2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ECBB9"/>
      <stop offset="1" stop-color="#4E9D87"/>
    </linearGradient>
  </defs>

  <!-- Fondo azul-verde suave -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.38"/>

  <!-- Gotas flanqueando -->
  <path d="M252,392 C262,410 267,419 267,428 A15,15 0 1 1 237,428 C237,419 242,410 252,392 Z" fill="#7FC4B2" opacity="0.85"/>
  <path d="M548,448 C557,462 561,470 561,478 A13,13 0 1 1 535,478 C535,470 539,462 548,448 Z" fill="#7FC4B2" opacity="0.7"/>

  <!-- Tapa y cuello -->
  <rect x="374" y="272" width="52" height="38" rx="8" fill="#2E6B5E"/>
  <rect x="380" y="304" width="40" height="62" rx="6" fill="#FFFFFF" opacity="0.85"/>
  <rect x="380" y="304" width="40" height="62" rx="6" fill="none" stroke="#2E6B5E" stroke-width="8"/>

  <!-- Botella -->
  <rect x="306" y="360" width="188" height="262" rx="24" fill="#FFFFFF" opacity="0.92"/>
  <rect x="306" y="360" width="188" height="262" rx="24" fill="none" stroke="#2E6B5E" stroke-width="10"/>

  <!-- Agua -->
  <path d="M326,446 C348,428 374,462 400,446 C426,430 452,464 474,448 L474,592 C474,608 462,612 450,612 L350,612 C338,612 326,608 326,592 Z" fill="url(#water)"/>

  <!-- Etiqueta con espada de San Miguel -->
  <rect x="330" y="462" width="140" height="84" rx="14" fill="#FFFDF6" opacity="0.96"/>
  <rect x="330" y="462" width="140" height="84" rx="14" fill="none" stroke="#2E6B5E" stroke-width="6"/>
  <g fill="#C9932F">
    <path d="M396,470 L404,470 L400,486 Z"/>
    <rect x="396" y="486" width="8" height="24"/>
    <rect x="384" y="508" width="32" height="8" rx="3"/>
    <rect x="397" y="516" width="6" height="16"/>
    <circle cx="400" cy="536" r="5"/>
  </g>

  <!-- Destellos -->
  <path d="M262,264 L269,278 L283,285 L269,292 L262,306 L255,292 L241,285 L255,278 Z" fill="#C9932F" opacity="0.55"/>
  <path d="M540,288 L545,298 L556,304 L545,309 L540,320 L535,309 L524,304 L535,298 Z" fill="#C9932F" opacity="0.45"/>

  <!-- Sombra en el piso -->
  <ellipse cx="400" cy="636" rx="130" ry="16" fill="#1F5A4E" opacity="0.18"/>
</svg>
