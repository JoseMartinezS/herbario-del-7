<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F0DB"/>
      <stop offset="1" stop-color="#EFDCB2"/>
    </linearGradient>
  </defs>

  <!-- Fondo ámbar -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="#FFFFFF" opacity="0.38"/>

  <!-- Cápsula (mitad ámbar + mitad crema) -->
  <g transform="translate(400,408) rotate(-28)">
    <path d="M-104,-56 L0,-56 L0,56 L-104,56 A56,56 0 0 1 -104,-56 Z" fill="#C9932F"/>
    <path d="M104,-56 L0,-56 L0,56 L104,56 A56,56 0 0 1 104,-56 Z" fill="#F5E7C6"/>
    <path d="M-104,-56 L104,-56 A56,56 0 0 1 104,56 L-104,56 A56,56 0 0 1 -104,-56 Z" fill="none" stroke="#A66B1E" stroke-width="9" stroke-linejoin="round"/>
    <rect x="-80" y="-11" width="22" height="22" rx="6" fill="#A66B1E" opacity="0.5"/>
    <rect x="-44" y="-11" width="22" height="22" rx="6" fill="#A66B1E" opacity="0.5"/>
    <rect x="30" y="-40" width="18" height="80" rx="9" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Bulbo de ajo -->
  <g transform="translate(258,590)">
    <path d="M-14,-36 C-8,-54 -2,-64 0,-76 C2,-64 8,-54 14,-36 Z" fill="#F7F0E3" stroke="#C9B28C" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="0" cy="2" r="46" fill="#F7F0E3" stroke="#C9B28C" stroke-width="8"/>
    <path d="M0,-38 L0,42" stroke="#C9B28C" stroke-width="6" fill="none"/>
    <path d="M-22,-30 C-26,-8 -26,12 -22,34" stroke="#C9B28C" stroke-width="6" fill="none"/>
    <path d="M22,-30 C26,-8 26,12 22,34" stroke="#C9B28C" stroke-width="6" fill="none"/>
  </g>

  <!-- Gránulos -->
  <circle cx="536" cy="322" r="9" fill="#C9932F" opacity="0.5"/>
  <circle cx="562" cy="386" r="6" fill="#C9932F" opacity="0.4"/>
  <circle cx="298" cy="296" r="7" fill="#C9932F" opacity="0.45"/>
  <circle cx="332" cy="252" r="5" fill="#C9932F" opacity="0.35"/>

  <!-- Sombras en el piso -->
  <ellipse cx="400" cy="560" rx="170" ry="18" fill="#A66B1E" opacity="0.15"/>
  <ellipse cx="258" cy="654" rx="52" ry="9" fill="#A66B1E" opacity="0.15"/>
</svg>
